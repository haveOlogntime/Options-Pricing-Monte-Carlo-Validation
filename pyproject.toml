[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricing-hedging-lab"
version = "0.1.0"
description = "European option pricing, implied volatility, Monte Carlo, and delta-hedging experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["options_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
